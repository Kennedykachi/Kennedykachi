<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Kennedy Onyekachi Isiguzoro — Technology Learning Sphere">
  <defs>
    <radialGradient id="ts-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#5cffd9" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#5cffd9" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#5cffd9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ts-sphere" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0"   stop-color="#1a2a52"/>
      <stop offset="0.6" stop-color="#0a0f24"/>
      <stop offset="1"   stop-color="#040614"/>
    </radialGradient>

    <radialGradient id="ts-shine" cx="0.3" cy="0.25" r="0.3">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ts-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cffd9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="ts-soft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#040614"/>

  <!-- Background grid -->
  <g stroke="#0a1230" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Side panel — left -->
  <g transform="translate(60,80)">

    <g font-family="'JetBrains Mono', monospace"
       font-size="10"
       letter-spacing="4"
       fill="#5cffd9">
      <line x1="0" y1="-10" x2="20" y2="-10"
            stroke="#5cffd9"
            stroke-width="0.6"/>
      <text x="28" y="-6">ORBITAL TOOLBELT · v.2026</text>
    </g>

    <!-- Name -->
    <text y="40"
          font-family="'Fraunces', 'Playfair Display', Georgia, serif"
          font-size="56"
          font-weight="500"
          font-style="italic"
          fill="#e8edff"
          letter-spacing="-1.5">
      Kennedy Onyekachi Isiguzoro
    </text>

    <text y="68"
          font-family="'JetBrains Mono', monospace"
          font-size="11"
          fill="#5cffd9"
          letter-spacing="3">
      CYBERSECURITY · TECHNOLOGY · BUILDER
    </text>

    <line x1="0" y1="100" x2="380" y2="100"
          stroke="#1a2238"
          stroke-width="0.6"/>

    <!-- Personalized bio -->
    <text y="128"
          font-family="'JetBrains Mono', monospace"
          font-size="11"
          fill="#cbd5e1">
      Building a foundation in cybersecurity,
    </text>

    <text y="148"
          font-family="'JetBrains Mono', monospace"
          font-size="11"
          fill="#cbd5e1">
      networking, programming and software.
    </text>

    <text y="168"
          font-family="'JetBrains Mono', monospace"
          font-size="11"
          fill="#cbd5e1">
      Learning through practical projects,
    </text>

    <text y="188"
          font-family="'JetBrains Mono', monospace"
          font-size="11"
          fill="#cbd5e1">
      experimentation and continuous practice.
    </text>

    <line x1="0" y1="220" x2="380" y2="220"
          stroke="#1a2238"
          stroke-width="0.6"/>

    <!-- Learning tiers -->
    <g transform="translate(0,250)"
       font-family="'JetBrains Mono', monospace"
       font-size="10"
       fill="#a5b4cf"
       letter-spacing="2">

      <text>FOCUS</text>
      <text x="96" fill="#5cffd9">
        python · networking · linux
      </text>

      <text y="20">BUILDING</text>
      <text x="96" y="20" fill="#5cffd9">
        git · github · django
      </text>

      <text y="40">EXPLORING</text>
      <text x="96" y="40" fill="#a78bfa">
        postgresql · figma
      </text>

    </g>
  </g>

  <!-- Vertical separator -->
  <line x1="500" y1="60" x2="500" y2="380"
        stroke="#1a2238"
        stroke-width="0.6"/>

  <!-- Sphere — right -->
  <g transform="translate(840,210)">

    <!-- Halo -->
    <circle r="220" fill="url(#ts-halo)"/>

    <!-- Sphere base -->
    <circle r="160" fill="url(#ts-sphere)"/>

    <!-- Specular shine -->
    <circle r="160" fill="url(#ts-shine)"/>

    <!-- Rim light -->
    <circle r="160"
            fill="none"
            stroke="url(#ts-rim)"
            stroke-width="1.2"/>

    <!-- Latitude ellipses -->
    <g filter="url(#ts-soft)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="22s"
        repeatCount="indefinite"/>

      <ellipse rx="160" ry="60"
               fill="none"
               stroke="#5cffd9"
               stroke-width="0.6"
               opacity="0.5"/>

      <ellipse rx="160" ry="60"
               fill="none"
               stroke="#5cffd9"
               stroke-width="0.6"
               opacity="0.4"
               transform="rotate(60)"/>

      <ellipse rx="160" ry="60"
               fill="none"
               stroke="#5cffd9"
               stroke-width="0.6"
               opacity="0.4"
               transform="rotate(120)"/>

      <ellipse rx="160" ry="20"
               fill="none"
               stroke="#a78bfa"
               stroke-width="0.5"
               opacity="0.4"/>

      <ellipse rx="160" ry="100"
               fill="none"
               stroke="#a78bfa"
               stroke-width="0.5"
               opacity="0.4"/>

      <ellipse rx="60" ry="160"
               fill="none"
               stroke="#5cffd9"
               stroke-width="0.5"
               opacity="0.35"/>

      <ellipse rx="120" ry="160"
               fill="none"
               stroke="#5cffd9"
               stroke-width="0.5"
               opacity="0.35"/>
    </g>

    <!-- Technology tokens -->
    <g font-family="'JetBrains Mono', monospace"
       font-size="13"
       font-weight="500">

      <!-- Counter-rotation keeps labels readable -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="-360"
        dur="22s"
        repeatCount="indefinite"/>

      <!-- FOCUS -->
      <g transform="translate(-135,-24)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">python</text>
      </g>

      <g transform="translate(-69,-119)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">networking</text>
      </g>

      <g transform="translate(-105,88)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">linux</text>
      </g>

      <!-- BUILDING -->
      <g transform="translate(98,57)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">git</text>
      </g>

      <g transform="translate(10,113)">
        <circle r="3" fill="#5cffd9"/>
        <text x="10" y="4" fill="#5cffd9">github</text>
      </g>

      <g transform="translate(86,-31)">
        <circle r="3" fill="#5cffd9"/>
        <text x="-10"
              y="4"
              text-anchor="end"
              fill="#5cffd9">
          django
        </text>
      </g>

      <!-- EXPLORING -->
      <g transform="translate(39,-83)">
        <circle r="3" fill="#a78bfa"/>
        <text x="10" y="4" fill="#a78bfa">
          postgresql
        </text>
      </g>

      <g transform="translate(18,26)" opacity="0.7">
        <text x="0"
              y="0"
              font-style="italic"
              fill="#fef3c7">
          figma
        </text>
